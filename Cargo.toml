[package]
name = "svue-api"
version = "1.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
time = { version = "0.3.55", features = [
  "formatting",
  "parsing",
  "macros",
  "wasm-bindgen",
] }
reqwest = { version = "0.13.5", features = ["form", "native-tls", "json"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "typed-header",
] }
tower-service = "0.3.3"
tower-http = { version = "0.7.1", features = [
  "cors",
  "compression-br",
  "compression-gzip",
] }
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
rand = "0.10.3"
aes-gcm-siv = "0.12.1"
base64 = "0.23.1"
crypto-common = "0.2.2"
serde_derive = "1.0.229"
argon2 = "0.6.0"
base58 = "0.2.0"
mimalloc = "0.1.52"
lazy_static = "1.5.1"
async_zip = { version = "0.0.19", features = ["deflate", "tokio"] }
serde_json = "1.0.153"
serde_bytes = "0.11.19"
futures = "0.3.34"
