[package]
name = "svue-api"
version = "1.1.0"
edition = "2024"

[dependencies]
aes = "0.9.0"
cbc = "0.2.0"
time = { version = "0.3.47", features = [
  "formatting",
  "parsing",
  "macros",
  "wasm-bindgen",
] }
reqwest = { version = "0.13.3", features = ["form", "native-tls", "json"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "typed-header",
] }
tower-service = "0.3.3"
tower-http = { version = "0.6.6", features = [
  "cors",
  "compression-br",
  "compression-gzip",
] }
quick-xml = { version = "0.40.1", features = ["serde", "serialize"] }
rand = "0.10.1"
aes-gcm-siv = "0.12.0-rc.3"
base64 = "0.22.1"
crypto-common = "0.2.2"
serde_derive = "1.0.228"
argon2 = "0.5.3"
base58 = "0.2.0"
mimalloc = "0.1.50"
lazy_static = "1.5.0"
async_zip = { version = "0.0.18", features = ["deflate", "tokio"] }
serde_json = "1.0.149"
serde_bytes = "0.11.19"
futures = "0.3.32"
